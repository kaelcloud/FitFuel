function Scanner({ onClose }) {
  const { dispatch, notify, setDate, setTab } = useApp();
  const [stage, setStage] = useState('camera');
  const [img, setImg] = useState(null);
  const [camErr, setCamErr] = useState('');
  const [camReady, setCamReady] = useState(false);
  const [flash, setFlash] = useState(false);
  const [items, setItems] = useState([]);
  const [meal, setMeal] = useState(mealForNow());
  const [status, setStatus] = useState(0);
  const videoRef = useRef(null), streamRef = useRef(null), libRef = useRef(null), shotRef = useRef(null), timerRef = useRef(null);

  const stopCam = () => { if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; } setCamReady(false); };

  useEffect(() => {
    document.body.classList.add('lock');
    return () => { document.body.classList.remove('lock'); stopCam(); clearTimeout(timerRef.current); };
  }, []);

  useEffect(() => {
    if (stage !== 'camera') { stopCam(); return; }
    let cancelled = false;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setCamErr('This browser can’t open the live camera here.'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
      .then(s => {
        if (cancelled) { s.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = s; setCamErr('');
        const v = videoRef.current;
        if (v) { v.srcObject = s; v.onloadedmetadata = () => { v.play().catch(() => {}); setCamReady(true); }; }
      })
      .catch(e => { if (!cancelled) setCamErr(e && e.name === 'NotAllowedError' ? 'Camera access is turned off for this app. Allow it in iPhone Settings, or use a photo instead.' : 'The camera couldn’t start. You can still take or choose a photo.'); });
    return () => { cancelled = true; stopCam(); };
  }, [stage]);

  useEffect(() => {
    if (stage !== 'analyzing') return;
    setStatus(0);
    const id = setInterval(() => setStatus(s => Math.min(s + 1, STATUS.length - 1)), 800);
    return () => clearInterval(id);
  }, [stage]);

  const capture = () => {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return;
    const s = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    setFlash(true); setTimeout(() => setFlash(false), 350);
    setImg(c.toDataURL('image/jpeg', 0.85)); setStage('preview');
  };

  const onFile = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type)) return notify('Choose an image file, such as a JPG or HEIC photo.', 'err');
    if (file.size > 15 * 1024 * 1024) return notify('That photo is over 15 MB. Choose a smaller one.', 'err');
    try { setImg(await downscale(file, 1280)); setStage('preview'); }
    catch { notify('That photo couldn’t be opened. Try another one.', 'err'); }
  };

  const analyze = () => {
    setStage('analyzing');
    timerRef.current = setTimeout(() => {
      setItems(DEMO_ITEMS.map(d => withGrams({ id: uid(), name: d.name, conf: d.conf, per100: { ...d.per100 }, kcal: '', protein: '', carbs: '', fat: '' }, String(d.grams))));
      setStage('results');
    }, 2600);
  };

  const addItem = () => setItems(list => [...list, { id: uid(), name: '', grams: '', kcal: '', protein: '', carbs: '', fat: '', per100: null, conf: null }]);

  const save = () => {
    if (!items.length) return notify('Add at least one food before saving.', 'err');
    for (const it of items) { const e = validateFood(it); if (e) return notify(`${it.name || 'An item'}: ${e}`, 'err'); }
    const t = todayKey();
    dispatch({ type: 'addEntries', entries: items.map(it => toEntry({ ...it, meal }, t, 'scan-demo', true)) });
    setDate(t); setTab('home');
    notify(`Saved ${items.length} item${items.length > 1 ? 's' : ''} to ${mealLabel(meal)}`);
    onClose();
  };

  const tot = sumNut(items.map(it => ({ kcal: num(it.kcal), protein: num(it.protein), carbs: num(it.carbs), fat: num(it.fat) })));
  const top = (left, right) => html`<div className="scan-top">${left}${right || html`<span></span>`}</div>`;
  const closeBtn = html`<button className="round-btn glass press" aria-label="Close scanner" onClick=${onClose}><${Icon} name="x" size=${18} /></button>`;
  const demoPill = html`<span className="pill glass demo"><${Icon} name="info" size=${14} />Demo mode</span>`;
  const inputs = html`<div>
    <input ref=${libRef} type="file" accept="image/*" hidden onChange=${onFile} />
    <input ref=${shotRef} type="file" accept="image/*" capture="environment" hidden onChange=${onFile} />
  </div>`;

  return html`<div className="scanner" role="dialog" aria-modal="true" aria-label="Food scanner">
    ${inputs}
    ${stage === 'camera' && html`<div style=${{ display: 'contents' }}>
      <div className="cam"><video ref=${videoRef} playsInline muted autoPlay style=${{ opacity: camReady ? 1 : 0, transition: 'opacity .3s' }}></video></div>
      ${top(closeBtn, demoPill)}
      ${camErr ? html`<div className="cam-err glass">
        <div className="halo"><${Icon} name="camera" size=${26} /></div>
        <h3>Use a photo instead</h3><p>${camErr}</p>
        <button className="btn primary press" onClick=${() => shotRef.current.click()}><${Icon} name="camera" size=${18} />Take photo</button>
        <button className="btn ghost press" onClick=${() => libRef.current.click()}><${Icon} name="image" size=${18} />Choose from library</button>
      </div>` : html`<div style=${{ display: 'contents' }}>
        <div className="frame"><i></i><i></i><i></i><i></i></div>
        <div className="scan-hint"><span className="glass">${camReady ? 'Fit the whole plate inside the frame' : 'Starting camera…'}</span></div>
        <div className="scan-bottom">
          <button className="side-btn glass press" aria-label="Choose from library" onClick=${() => libRef.current.click()}><${Icon} name="image" size=${22} /></button>
          <button className="shutter" aria-label="Take photo" disabled=${!camReady} onClick=${capture}><span></span></button>
          <span></span>
        </div>
      </div>`}
      ${flash && html`<div className="flash"></div>`}
    </div>`}

    ${stage === 'preview' && html`<div style=${{ display: 'contents' }}>
      <div className="cam"><img src=${img} alt="Your meal photo" /></div>
      ${flash && html`<div className="flash"></div>`}
      ${top(closeBtn, demoPill)}
      <div className="preview-actions">
        <button className="btn ghost press" onClick=${() => { setImg(null); setStage('camera'); }}>Retake</button>
        <button className="btn primary press" onClick=${analyze}><${Icon} name="sparkles" size=${18} />Analyze photo</button>
      </div>
    </div>`}

    ${stage === 'analyzing' && html`<div className="analyzing">
      ${top(closeBtn, demoPill)}
      <div className="an-photo"><img src=${img} alt="" /><div className="an-grid"></div><div className="an-line"></div></div>
      <div className="an-status"><h3><${Icon} name="sparkles" size=${20} />Analyzing your meal</h3><p key=${status}>${STATUS[status]}</p></div>
      <div className="skel-wrap"><div className="skel"></div><div className="skel" style=${{ opacity: .7 }}></div><div className="skel" style=${{ opacity: .45 }}></div></div>
    </div>`}

    ${stage === 'results' && html`<div style=${{ display: 'contents' }}>
      ${top(closeBtn, html`<button className="pill glass press" onClick=${() => { setItems([]); setImg(null); setStage('camera'); }}><${Icon} name="camera" size=${14} />Rescan</button>`)}
      <div className="results">
        <div className="res-photo"><img src=${img} alt="Scanned meal" /><div><h2>${items.length} item${items.length === 1 ? '' : 's'} found</h2><p>Check each one before saving</p></div></div>
        <div className="banner demo"><${Icon} name="alert" size=${17} /><span>Demo mode: these are fixed sample results, not an analysis of your photo. Real AI scanning is added in Stage 5.</span></div>
        <div className="res-total">
          <div><b>${fmt(tot.kcal)}</b><span>kcal</span></div>
          <div><b style=${{ color: 'var(--mint)' }}>${fmt(tot.protein)}</b><span>protein</span></div>
          <div><b style=${{ color: 'var(--gold)' }}>${fmt(tot.carbs)}</b><span>carbs</span></div>
          <div><b style=${{ color: 'var(--coral)' }}>${fmt(tot.fat)}</b><span>fat</span></div>
        </div>
        <div className="meal-pick"><${MealSeg} value=${meal} onChange=${setMeal} /></div>
        ${items.map((it, i) => html`<${ResultItem} key=${it.id} it=${it} index=${i}
          onChange=${n => setItems(list => list.map(x => x.id === it.id ? n : x))}
          onRemove=${() => setItems(list => list.filter(x => x.id !== it.id))} />`)}
        <button className="add-big press" onClick=${addItem}><${Icon} name="plus" size=${18} />Add a missed item</button>
        <div className="banner info"><${Icon} name="info" size=${16} /><span>Weights from a photo are always estimates. Adjust the grams if you know the real portion.</span></div>
      </div>
      <div className="save-bar"><button className="btn primary block press" disabled=${!items.length} onClick=${save}><${Icon} name="check" size=${19} />Save to ${mealLabel(meal)}</button></div>
    </div>`}
  </div>`;
}

/* ---------------- shell ---------------- */
const TABS = [
  { id: 'home', label: 'Home', icon: 'home' },
  { id: 'log', label: 'Food log', icon: 'log' },
  { id: 'scan' },
  { id: 'progress', label: 'Progress', icon: 'progress' },
  { id: 'settings', label: 'Settings', icon: 'settings' },
];
function TabBar({ tab, onTab, onScan }) {
  return html`<nav className="tabbar" aria-label="Main"><div className="tabbar-inner">
    ${TABS.map(t => t.id === 'scan'
      ? html`<button key="scan" className="tab-scan press" aria-label="Scan food" onClick=${onScan}><span><${Icon} name="scan" size=${26} stroke=${2.3} /></span></button>`
      : html`<button key=${t.id} className=${'tab press' + (tab === t.id ? ' on' : '')} aria-current=${tab === t.id ? 'page' : undefined} onClick=${() => onTab(t.id)}><${Icon} name=${t.icon} size=${23} />${t.label}</button>`)}
  </div></nav>`;
}

function Splash() {
  return html`<div className="app splash" aria-busy="true" aria-label="Loading">
    <div className="skel" style=${{ height: 22, width: 140, borderRadius: 8 }}></div>
    <div className="skel" style=${{ height: 40, width: 190, borderRadius: 10, marginBottom: 22 }}></div>
    <div className="skel" style=${{ height: 400, borderRadius: 34 }}></div>
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10 }}>
      <div className="skel" style=${{ height: 110, borderRadius: 22 }}></div><div className="skel" style=${{ height: 110, borderRadius: 22 }}></div><div className="skel" style=${{ height: 110, borderRadius: 22 }}></div>
    </div>
  </div>`;
}

function App() {
  const [state, setState] = useState(null);
  const [meta, setMetaState] = useState({});
  const [storage, setStorage] = useState({ ok: true, persisted: null });
  const stateRef = useRef(null), okRef = useRef(true);
  const [tab, setTabRaw] = useState('home');
  const [date, setDate] = useState(todayKey());
  const [scan, setScan] = useState(false);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const notify = useCallback((msg, kind = 'ok') => setToast({ msg, kind, id: uid() }), []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.kind === 'err' ? 4200 : 2600); return () => clearTimeout(t); }, [toast]);

  const setMeta = useCallback((key, value) => {
    setMetaState(m => ({ ...m, [key]: value }));
    if (okRef.current) DB.setMeta(key, value).catch(() => {});
  }, []);

  useEffect(() => {
    let alive = true;
    DB.load().then(o => {
      if (!alive) return;
      const { state: s, meta: m } = stateFromDB(o);
      stateRef.current = s; setState(s); setMetaState(m);
      if (!m.firstUse) setMeta('firstUse', Date.now());
    }).catch(() => {
      if (!alive) return;
      okRef.current = false; stateRef.current = INITIAL; setState(INITIAL);
      setStorage(x => ({ ...x, ok: false }));
      notify('Saving isn’t available here. Changes will be lost when you close FitFuel.', 'err');
    });
    requestPersist().then(p => { if (alive) setStorage(x => ({ ...x, persisted: p })); });
    return () => { alive = false; };
  }, []);

  /* Update the screen straight away, then save to IndexedDB. */
  const dispatch = useCallback(a => {
    const next = reducer(stateRef.current, a);
    stateRef.current = next; setState(next);
    if (!okRef.current) return Promise.resolve();
    const p = persistAction(a, next);
    p.catch(() => notify('That change couldn’t be saved on this iPhone. Check free storage and try again.', 'err'));
    return p;
  }, [notify]);

  const restoreAll = useCallback(async s => {
    if (okRef.current) await DB.replaceAll(s);
    stateRef.current = s; setState(s);
  }, []);

  const wipe = useCallback(() => {
    dispatch({ type: 'reset' });
    setMetaState({});
    setMeta('firstUse', Date.now());
  }, [dispatch, setMeta]);

  const backup = useCallback(async () => {
    try {
      const r = await saveFile(`fitfuel-backup-${todayKey()}.json`, 'application/json', makeBackup(stateRef.current));
      if (r === 'cancelled') return;
      setMeta('lastBackup', Date.now());
      notify(r === 'shared' ? 'Backup saved' : 'Backup downloaded');
    } catch (_) { notify('The backup couldn’t be created. Try again.', 'err'); }
  }, [notify, setMeta]);

  const setTab = useCallback(t => { setTabRaw(t); window.scrollTo(0, 0); }, []);
  if (!state) return html`<${Splash} />`;
  const ctx = {
    state, dispatch, date, setDate, notify, setTab, meta, setMeta, storage, backup, restoreAll, wipe,
    openSheet: (type, props = {}) => setSheet({ type, props, id: uid() }),
    closeSheet: () => setSheet(null),
    openScan: () => setScan(true),
  };
  const Screen = { home: Home, log: FoodLog, progress: Progress, settings: Settings }[tab];
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="app"><main className="screen" key=${tab}><${Screen} /></main></div>
    <${TabBar} tab=${tab} onTab=${setTab} onScan=${() => setScan(true)} />
    ${scan && html`<${Scanner} onClose=${() => setScan(false)} />`}
    <${SheetHost} sheet=${sheet} />
    ${toast && html`<div className=${'toast ' + toast.kind} key=${toast.id} role="status"><span className="ti"><${Icon} name=${toast.kind === 'err' ? 'alert' : 'check'} size=${14} stroke=${2.6} /></span>${toast.msg}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
</html>
