<style>:root{
  --ink:#000;--s1:#121212;--s2:#1a1a1a;--s3:#242424;--s4:#2f2f2f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#F3F3EF;--mute:#8E8E89;--dim:#5E5E5A;
  --lime:#C8F547;--lime-ink:#11160A;--lime-soft:rgba(200,245,71,.12);
  --mint:#7FE0B8;--gold:#F2D27A;--coral:#FF9472;--aqua:#6CC7FF;--over:#FF7A59;
  --sans:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.press{transition:transform .14s var(--ease),opacity .14s}
.press:active{transform:scale(.96);opacity:.85}

.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(118px + env(safe-area-inset-bottom,0px))}
.screen{animation:enter .3s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
.greet{color:var(--mute);font-size:15px;margin-bottom:2px}
.title{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.title-btn{text-align:left}
.date-sub{color:var(--mute);font-size:15px;margin-bottom:18px}
.stepper{display:flex;gap:8px;padding-bottom:4px}
.round-btn{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.round-btn:disabled{opacity:.3}

/* hero dial */
.hero{background:radial-gradient(120% 80% at 50% 0%,#17190f 0%,var(--s1) 55%);border:1px solid var(--line);border-radius:34px;padding:18px 18px 16px;margin-bottom:12px}
.dial{position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:1}
.dial svg{width:100%;height:100%;overflow:visible}
.tick{stroke:var(--s4);stroke-width:3;stroke-linecap:round;transition:stroke .35s}
.tick.major{stroke-width:3.5}
.tick.on{stroke:var(--lime)}
.tick.on.over{stroke:var(--over)}
.tick.tip{filter:drop-shadow(0 0 6px rgba(200,245,71,.85))}
.p-track{stroke:var(--s3);stroke-width:7;fill:none;stroke-linecap:round}
.p-arc{stroke:var(--mint);stroke-width:7;fill:none;stroke-linecap:round;transition:stroke-dasharray 1.1s var(--ease)}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:6px}
.dial-big{font-size:clamp(46px,15vw,60px);font-weight:700;line-height:1;letter-spacing:-.035em}
.dial-big.over{color:var(--over)}
.dial-unit{color:var(--mute);font-size:15px;margin-top:6px}
.dial-pro{margin-top:14px;font-size:13px;color:var(--mint);display:flex;align-items:center;gap:6px}
.dial-pro i{width:8px;height:8px;border-radius:50%;background:var(--mint);display:block}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;border-top:1px solid var(--line);padding-top:14px}
.hero-stats div{text-align:center}
.hero-stats div+div{border-left:1px solid var(--line)}
.hero-stats span{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.hero-stats b{font-family:var(--round);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

/* macros */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.macro{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:14px 13px 13px}
.macro-label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.macro-label i{width:7px;height:7px;border-radius:50%;display:block}
.macro-val{font-size:22px;font-weight:650;line-height:1}
.macro-val small{font-size:13px;color:var(--mute);font-weight:500;margin-left:2px}
.bar{height:5px;border-radius:5px;background:var(--s3);margin:11px 0 7px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:5px;transition:width .9s var(--ease)}
.macro-left{font-size:12px;color:var(--mute)}

/* scan cta */
.scan-cta{width:100%;display:flex;align-items:center;gap:14px;background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:16px 16px;margin-bottom:12px;text-align:left}
.scan-cta .ico{width:46px;height:46px;border-radius:15px;background:rgba(0,0,0,.1);display:grid;place-items:center}
.scan-cta b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
.scan-cta span{font-size:13px;opacity:.72}
.scan-cta .go{margin-left:auto;opacity:.6}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-head h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sec-head span,.sec-head button{color:var(--mute);font-size:14px}
.sec-head button{color:var(--lime)}

/* water */
.water{display:flex;gap:16px;align-items:stretch}
.vial{width:44px;border-radius:16px;background:var(--s3);position:relative;overflow:hidden;min-height:112px;flex:none}
.vial span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#8fd6ff,var(--aqua));transition:height .8s var(--ease)}
.vial span::before{content:"";position:absolute;top:-4px;left:-10%;width:120%;height:8px;background:inherit;border-radius:50%;opacity:.7}
.water-main{flex:1;display:flex;flex-direction:column;min-width:0}
.water-top{display:flex;justify-content:space-between;align-items:baseline}
.water-top h3{font-size:16px;font-weight:600}
.water-amt{font-size:26px;font-weight:650;margin:4px 0 2px}
.water-amt small{font-size:14px;color:var(--mute);font-weight:500}
.water-note{color:var(--mute);font-size:13px}
.chips{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.chip{flex:1;height:38px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--aqua)}
.chip.undo{flex:0 0 38px;color:var(--mute);display:grid;place-items:center}

/* timeline */
.tl{position:relative}
.tl-meal{position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;padding-bottom:16px}
.tl-meal:not(:last-child)::before{content:"";position:absolute;left:19.5px;top:42px;bottom:2px;width:1px;background:var(--line2)}
.tl-node{width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.tl-node.has{background:var(--lime-soft);border-color:rgba(200,245,71,.3);color:var(--lime)}
.tl-body{padding-top:2px;min-width:0}
.tl-head{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.tl-head h3{font-size:16px;font-weight:600}
.tl-head .kc{font-size:15px;color:var(--mute)}
.tl-add{color:var(--lime);font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;padding:6px 0 6px 10px}
.entry{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-top:6px;text-align:left}
.entry-main{flex:1;min-width:0}
.entry-name{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-sub{font-size:13px;color:var(--mute);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry-kc{font-size:16px;font-weight:600}
.entry-kc small{font-size:12px;color:var(--mute);font-weight:500}
.est{font-size:11px;font-weight:600;color:var(--gold);background:rgba(242,210,122,.12);border-radius:6px;padding:1px 6px}
.demo-tag{font-size:11px;font-weight:600;color:var(--coral);background:rgba(255,148,114,.12);border-radius:6px;padding:1px 6px}
.mac{display:inline-flex;gap:8px}
.mac b{font-weight:500}
.mac .p{color:var(--mint)}.mac .c{color:var(--gold)}.mac .f{color:var(--coral)}

/* food log */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:16px;color:var(--mute)}
.wd small{font-size:12px}
.wd b{font-family:var(--round);font-size:17px;font-weight:600;color:var(--text)}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.dot{background:var(--lime)}
.wd.sel{background:var(--lime)}.wd.sel small,.wd.sel b{color:var(--lime-ink)}.wd.sel i.dot{background:var(--lime-ink)}
.wd:disabled{opacity:.28}
.totals{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:14px 6px;margin-bottom:12px}
.totals div{text-align:center}
.totals div+div{border-left:1px solid var(--line)}
.totals b{display:block;font-family:var(--round);font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.totals span{font-size:12px;color:var(--mute)}
.add-big{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;background:var(--s2);border:1px solid var(--line2);font-weight:600;font-size:16px;margin-bottom:6px}
.add-big .ic{color:var(--lime)}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);max-width:170px;text-align:left}
.qchip b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:142px}
.qchip span{font-size:12px;color:var(--mute)}
.meal-card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:6px 14px 10px;margin-bottom:10px}
.meal-head{display:flex;align-items:center;gap:10px;padding:8px 0}
.meal-head .ic{color:var(--lime)}
.meal-head h3{font-size:17px;font-weight:650;flex:1}
.meal-head .kc{color:var(--mute);font-size:14px}
.meal-row{width:100%;display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.meal-empty{border-top:1px solid var(--line);padding:12px 0 4px;display:flex;gap:16px;flex-wrap:wrap}
.link{color:var(--lime);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.link.mute{color:var(--mute)}

/* empty states */
.empty{text-align:center;padding:22px 14px 10px}
.empty .halo{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--lime-soft);color:var(--lime)}
.empty h3{font-size:16px;font-weight:600;margin-bottom:4px}
.empty p{color:var(--mute);font-size:14px;line-height:1.45;max-width:30ch;margin:0 auto}
.empty .btn{margin-top:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:16px;font-weight:650;font-size:16px}
.btn.primary{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{background:var(--s2);border:1px solid var(--line2)}
.btn.danger{background:rgba(255,122,89,.14);color:var(--over)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}

/* segmented */
.seg{display:flex;background:var(--s2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--s4);color:var(--text)}

/* progress */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:14px}
.stat span{font-size:13px;color:var(--mute)}
.stat b{display:block;font-family:var(--round);font-size:26px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;color:var(--mute);font-weight:500;margin-left:3px}
.stat .meter{display:flex;gap:3px;margin-top:10px}
.stat .meter i{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.stat .meter i.on{background:var(--lime)}
.stat .meter i.on.p{background:var(--mint)}
.chart{width:100%;height:auto;display:block}
.chart .tline{stroke:var(--mute);stroke-dasharray:4 5;stroke-width:1}
.chart .bar-r{fill:var(--lime)}
.chart .bar-r.over{fill:var(--over)}
.chart .bar-r.zero{fill:var(--s3)}
.chart .lbl{fill:var(--dim);font-size:10px;font-family:var(--sans)}
.chart .lbl.sel{fill:var(--text)}
.chart .wline{fill:none;stroke:var(--lime);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .wdot{fill:var(--mute)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.chart-head h3{font-size:16px;font-weight:600}
.chart-head p{font-size:13px;color:var(--mute);margin-top:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--lime);vertical-align:middle;margin-right:5px}
.legend i.d{border-top:1px dashed var(--mute)}
.legend i.dot{width:6px;height:6px;border:0;border-radius:50%;background:var(--mute)}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);margin:4px 0 14px}
.wsum div+div{border-left:1px solid var(--line);padding-left:12px}
.wsum span{font-size:12px;color:var(--mute)}
.wsum b{display:block;font-family:var(--round);font-size:20px;font-weight:650;margin-top:2px}
.note{font-size:13px;color:var(--mute);line-height:1.45;display:flex;gap:8px;margin-top:12px}
.note .ic{margin-top:1px;flex:none}
.hist{margin-top:10px}
.hist-row{display:flex;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist-row span{flex:1;color:var(--mute)}
.hist-row b{font-family:var(--round);font-weight:600;margin-right:12px}
.hist-row button{color:var(--dim);padding:4px}

/* settings */
.profile-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-size:24px;font-weight:700;font-family:var(--round);flex:none}
.profile-card h3{font-size:19px;font-weight:650}
.profile-card p{font-size:14px;color:var(--mute);margin-top:2px}
.group{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px}
.group-title{font-size:14px;color:var(--mute);margin:20px 4px 8px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;min-height:54px}
.row+.row{border-top:1px solid var(--line)}
.row .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--s3);color:var(--text);flex:none}
.row .ri.lime{background:var(--lime-soft);color:var(--lime)}
.row .ri.red{background:rgba(255,122,89,.14);color:var(--over)}
.row .rl{flex:1;font-size:16px}
.row .rl small{display:block;font-size:13px;color:var(--mute);margin-top:1px}
.row .rv{color:var(--mute);font-size:15px;font-family:var(--round)}
.row .chev{color:var(--dim)}
.row:disabled .rl,.row:disabled .ri{opacity:.45}
.badge{font-size:12px;font-weight:600;color:var(--mute);background:var(--s3);padding:3px 8px;border-radius:999px;white-space:nowrap}
.badge.coral{color:var(--coral);background:rgba(255,148,114,.12)}
.foot{font-size:13px;color:var(--dim);text-align:center;line-height:1.5;margin:18px 10px 0}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 8px);pointer-events:none}
.tabbar-inner{max-width:452px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:rgba(22,22,22,.82);-webkit-backdrop-filter:saturate(160%) blur(22px);backdrop-filter:saturate(160%) blur(22px);border:1px solid var(--line2);border-radius:30px;height:68px;padding:0 4px;pointer-events:auto}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--dim);font-size:11px;font-weight:600}
.tab.on{color:var(--lime)}
.tab-scan{display:flex;justify-content:center;height:100%;align-items:center}
.tab-scan span{width:60px;height:60px;border-radius:21px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 10px 26px rgba(200,245,71,.28),0 0 0 6px var(--ink)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#151515;border:1px solid var(--line2);border-bottom:0;border-radius:30px 30px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .34s var(--ease)}
.closing .backdrop{animation:fade .22s ease reverse forwards}
.closing .sheet{animation:down .22s ease forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s4);margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sheet-head .round-btn{width:34px;height:34px}
.sheet p.lead{color:var(--mute);font-size:15px;line-height:1.45;margin:-6px 0 16px}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 2px}
.inp{width:100%;height:50px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);padding:0 14px;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--lime)}
.inp-unit{position:relative}
.inp-unit .inp{padding-right:48px}
.inp-unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .inp{padding:0 8px;text-align:center;height:46px}
.grid4 label{text-align:center;margin-left:0}
.err{color:var(--over);font-size:14px;margin:4px 2px 10px;display:flex;gap:6px;align-items:center}
.hint{color:var(--mute);font-size:13px;margin:-4px 2px 12px;line-height:1.4}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:80;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#1f1f1f;border:1px solid var(--line2);border-radius:999px;padding:11px 18px 11px 12px;font-size:15px;font-weight:550;max-width:calc(100vw - 32px);box-shadow:0 12px 30px rgba(0,0,0,.5);animation:drop .35s var(--ease)}
.toast .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);flex:none}
.toast.err .ti{background:var(--over);color:#200}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}

/* scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;animation:fade .25s ease}
.cam{position:absolute;inset:0;overflow:hidden}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.scan-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.glass{background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)}
.scan-top .round-btn{width:40px;height:40px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600}
.pill.demo{color:var(--coral)}
.frame{position:absolute;z-index:1;left:9%;right:9%;top:22%;aspect-ratio:1;pointer-events:none}
.frame i{position:absolute;width:36px;height:36px;border:3px solid var(--lime);opacity:.95}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scan-hint{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:center}
.scan-hint span{display:inline-block;padding:8px 14px;border-radius:999px;font-size:14px}
.scan-bottom{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 30px calc(env(safe-area-inset-bottom,0px) + 30px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.shutter{width:82px;height:82px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;transition:transform .12s}
.shutter span{width:64px;height:64px;border-radius:50%;background:#fff;transition:transform .12s,background .12s}
.shutter:active span{transform:scale(.88);background:var(--lime)}
.shutter:disabled{opacity:.35}
.side-btn{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;justify-self:start}
.cam-err{position:absolute;z-index:2;left:20px;right:20px;top:30%;text-align:center;padding:24px 20px;border-radius:26px}
.cam-err .halo{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--s3)}
.cam-err h3{font-size:18px;font-weight:650;margin-bottom:6px}
.cam-err p{color:var(--mute);font-size:14px;line-height:1.45;margin-bottom:16px}
.cam-err .btn{width:100%;margin-top:8px}
.preview-actions{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%)}
.preview-actions .btn{flex:1}
.flash{position:absolute;inset:0;z-index:5;background:#fff;animation:flash .35s ease forwards;pointer-events:none}
@keyframes flash{from{opacity:.85}to{opacity:0}}

.analyzing{position:relative;flex:1;display:flex;flex-direction:column;overflow-y:auto}
.an-photo{position:relative;margin:4px 18px 0;border-radius:28px;overflow:hidden;aspect-ratio:4/3.4;flex:none}
.an-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.75) brightness(.8)}
.an-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(200,245,71,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(200,245,71,.1) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);animation:gridmove 2.2s linear infinite}
.an-line{position:absolute;left:0;right:0;height:2px;background:var(--lime);box-shadow:0 0 18px 4px rgba(200,245,71,.6);animation:sweep 1.8s var(--ease) infinite alternate}
@keyframes sweep{from{top:6%}to{top:94%}}
@keyframes gridmove{from{background-position:0 0}to{background-position:0 28px}}
.an-status{text-align:center;padding:22px 20px 10px}
.an-status h3{font-size:20px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px}
.an-status p{color:var(--mute);font-size:14px;margin-top:4px;min-height:20px}
.skel-wrap{padding:6px 18px 30px}
.skel{height:84px;border-radius:20px;margin-bottom:10px;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

.results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 110px)}
.res-photo{display:flex;gap:14px;align-items:center;margin:2px 0 14px}
.res-photo img{width:76px;height:76px;border-radius:20px;object-fit:cover;flex:none}
.res-photo h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.res-photo p{color:var(--mute);font-size:14px;margin-top:2px}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.45;margin-bottom:14px}
.banner.demo{background:rgba(255,148,114,.1);border:1px solid rgba(255,148,114,.25);color:#ffd2c3}
.banner.demo .ic{color:var(--coral);margin-top:1px}
.banner.info{background:var(--s1);border:1px solid var(--line);color:var(--mute)}
.res-total{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px 4px;margin-bottom:14px}
.res-total div{text-align:center}
.res-total div+div{border-left:1px solid var(--line)}
.res-total b{display:block;font-family:var(--round);font-size:18px;font-weight:650}
.res-total span{font-size:12px;color:var(--mute)}
.item{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;animation:enter .35s var(--ease) both}
.item-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.item-top .inp{height:44px;font-weight:600}
.item-top .round-btn{width:36px;height:36px;flex:none;color:var(--mute)}
.item-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 12px;font-size:13px;color:var(--mute)}
.conf{display:inline-flex;align-items:center;gap:5px}
.conf i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.conf.high i{background:var(--lime)}.conf.low i{background:var(--over)}
.portion{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.portion label{font-size:13px;color:var(--mute);flex:1}
.portion .round-btn{width:40px;height:40px}
.portion .inp-unit{width:112px}
.portion .inp{height:42px;text-align:center;padding-right:30px;font-weight:600}
.portion .inp-unit span{right:10px}
.save-bar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(transparent,#000 30%)}
.meal-pick{margin-bottom:14px}

/* stage 2 */
.splash{display:flex;flex-direction:column;gap:12px}
.splash .skel{margin:0}
.nudge{display:flex;gap:14px;align-items:flex-start}
.nudge-ic{width:40px;height:40px;border-radius:13px;background:var(--lime-soft);color:var(--lime);display:grid;place-items:center;flex:none}
.nudge-main{flex:1;min-width:0}
.nudge-main h3{font-size:16px;font-weight:600}
.nudge-main p{font-size:14px;color:var(--mute);line-height:1.45;margin-top:3px}
.nudge-actions{display:flex;gap:8px;margin-top:12px}
.nudge-actions .btn{height:40px;padding:0 16px;font-size:14px;border-radius:12px}
div.row{cursor:default}
.toast{white-space:normal;line-height:1.35;border-radius:20px}

/* stage 3 */
.warn{display:flex;gap:7px;align-items:flex-start;color:var(--gold);font-size:13px;line-height:1.4;margin:0 2px 12px}
.warn .ic{flex:none;margin-top:1px}
.split{padding:14px 16px}
.split-head h3{font-size:15px;font-weight:600;margin-bottom:10px}
.split-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--s3)}
.split-bar span{display:block;height:100%;transition:width .8s var(--ease)}
.split-legend{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px}
.split-legend div{display:flex;flex-direction:column;gap:1px}
.split-legend span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.split-legend i{width:7px;height:7px;border-radius:50%;display:block}
.split-legend b{font-family:var(--round);font-size:20px;font-weight:650}
.split-legend small{font-size:12px;color:var(--dim)}
.meal-head h3 small{display:flex;font-size:12px;font-weight:500;margin-top:2px}
.calc{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--s4);flex:none;transition:border-color .2s,background .2s}
.radio.on{border:6px solid var(--lime)}
.sugg{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.sugg-row{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);padding:3px 0}
.sugg-row b{color:var(--text);font-weight:600}
.sugg-big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.sugg-big span{font-size:15px}
.sugg-big b{font-size:26px;font-weight:700;color:var(--lime)}
.sugg-macros{display:flex;gap:14px;font-size:14px;margin-top:6px}
.sugg-macros .p{color:var(--mint)}.sugg-macros .c{color:var(--gold)}.sugg-macros .f{color:var(--coral)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* stage 4 */
.search{position:relative;margin-bottom:6px}
.search .inp{padding-left:42px;-webkit-appearance:none;appearance:none}
.search .inp::-webkit-search-cancel-button{filter:invert(.6)}
.search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.fsec{margin-top:16px}
.fsec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.fsec-head h4{font-size:15px;font-weight:650}
.fsec-head span{font-size:12px;color:var(--mute)}
.fsec .group{margin-bottom:0}
.food-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;min-height:58px}
.food-row+.food-row{border-top:1px solid var(--line)}
.fr-kc{text-align:right;font-size:16px;font-weight:600;flex:none}
.fr-kc small{display:block;font-size:11px;color:var(--mute);font-weight:500;font-family:var(--sans)}
.src{font-size:11px;font-weight:650;border-radius:6px;padding:1px 6px}
.src-mal{color:var(--lime);background:var(--lime-soft)}
.src-usda{color:var(--aqua);background:rgba(108,199,255,.12)}
.src-custom{color:var(--gold);background:rgba(242,210,122,.12)}
.fav-dot{color:var(--gold);display:inline-block;margin-right:5px;vertical-align:-1px}
.skel-row{padding:10px 14px}.skel-row .skel{height:38px;border-radius:10px;margin:0}
.back{margin:-6px 0 10px}
.detail-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.detail-head h3{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.fav-btn{flex:none;color:var(--mute)}
.fav-btn.on{color:var(--gold);background:rgba(242,210,122,.12);border-color:rgba(242,210,122,.3)}
.src-box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.src-box>div{display:flex;gap:8px;align-items:center}
.src-box p{font-size:13px;color:var(--mute);line-height:1.45;margin-top:6px}
.ver{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip2{height:34px;padding:0 13px;border-radius:999px;background:var(--s2);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--text)}
.chip2.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.nut-card{display:flex;align-items:center;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.nut-big b{font-size:34px;font-weight:700;line-height:1}
.nut-big span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.nut-macros{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-left:1px solid var(--line);padding-left:14px}
.nut-macros b{display:block;font-size:16px;font-weight:650}
.nut-macros span{font-size:12px;color:var(--mute)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:0 2px 14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--lime);flex:none}
.a{color:var(--lime);font-weight:600;text-decoration:none}
.sheet.tall{min-height:86vh}
</style>
</head>

/* ---------------- state ---------------- */
const DEFAULT_PROFILE = { name: '', age: 34, gender: 'Male', height: 169, weight: 70, targetWeight: '', kcal: 2000, protein: 120, carbs: 230, fat: 60, water: 2500 };
const INITIAL = { profile: DEFAULT_PROFILE, entries: [], water: {}, weights: [], foods: [], favorites: [] };

function reducer(s, a) {
  switch (a.type) {
    case 'addEntries': return { ...s, entries: [...s.entries, ...a.entries] };
    case 'updateEntry': return { ...s, entries: s.entries.map(e => e.id === a.entry.id ? a.entry : e) };
    case 'deleteEntry': return { ...s, entries: s.entries.filter(e => e.id !== a.id) };
    case 'addWater': {
      const cur = s.water[a.date] || 0;
      return { ...s, water: { ...s.water, [a.date]: clamp(cur + a.ml, 0, 20000) } };
    }
    case 'setProfile': return { ...s, profile: { ...s.profile, ...a.profile } };
    case 'logWeight': {
      const weights = [...s.weights.filter(w => w.date !== a.date), { date: a.date, kg: a.kg }].sort((x, y) => x.date < y.date ? -1 : 1);
      return { ...s, weights, profile: { ...s.profile, weight: weights[weights.length - 1].kg } };
    }
    case 'deleteWeight': return { ...s, weights: s.weights.filter(w => w.date !== a.date) };
    case 'saveFood': return { ...s, foods: [...s.foods.filter(f => f.id !== a.food.id), a.food] };
    case 'deleteFood': return { ...s, foods: s.foods.filter(f => f.id !== a.id), favorites: s.favorites.filter(x => x !== a.id) };
    case 'toggleFav': return { ...s, favorites: s.favorites.includes(a.id) ? s.favorites.filter(x => x !== a.id) : [...s.favorites, a.id] };
    case 'deleteFoods': return { ...s, foods: s.foods.filter(f => !a.ids.includes(f.id)) };
    case 'reset': return INITIAL;
    default: return s;
  }
}
/* ---------------- on-device storage (IndexedDB) ---------------- */
const DB_NAME = 'fitfuel-ai', DB_VERSION = 1;
const STORES = ['profile', 'entries', 'water', 'weights', 'favorites', 'foods', 'meta'];
const DATA_STORES = ['profile', 'entries', 'water', 'weights', 'favorites', 'foods'];
const waterToList = w => Object.entries(w).filter(([, ml]) => ml > 0).map(([date, ml]) => ({ date, ml }));

const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB is not available'));
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return rej(e); }
    req.onupgradeneeded = () => {
      const db = req.result;
      const has = n => db.objectStoreNames.contains(n);
      if (!has('profile')) db.createObjectStore('profile');
      if (!has('entries')) db.createObjectStore('entries', { keyPath: 'id' }).createIndex('date', 'date');
      if (!has('water')) db.createObjectStore('water', { keyPath: 'date' });
      if (!has('weights')) db.createObjectStore('weights', { keyPath: 'date' });
      if (!has('favorites')) db.createObjectStore('favorites', { keyPath: 'id' });
      if (!has('foods')) db.createObjectStore('foods', { keyPath: 'id' });
      if (!has('meta')) db.createObjectStore('meta', { keyPath: 'key' });
    };
    req.onsuccess = () => { const db = req.result; db.onversionchange = () => db.close(); res(db); };
    req.onerror = () => rej(req.error);
    req.onblocked = () => rej(new Error('Storage is busy. Close other FitFuel windows and try again.'));
  }).catch(e => { dbp = null; throw e; }));
  const run = (stores, mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(stores, mode);
    let out;
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Save was interrupted'));
    try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) {} rej(e); }
  }));
  const putAll = (t, name, items) => { const s = t.objectStore(name); items.forEach(i => s.put(i)); };
  return {
    load: () => run(STORES, 'readonly', t => {
      const o = {};
      const get = (name, key) => { const r = key ? t.objectStore(name).get(key) : t.objectStore(name).getAll(); r.onsuccess = () => { o[name] = r.result; }; };
      get('profile', 'main'); get('entries'); get('water'); get('weights'); get('meta'); get('foods'); get('favorites');
      return o;
    }),
    put: (name, items) => run([name], 'readwrite', t => putAll(t, name, items)),
    del: (name, keys) => run([name], 'readwrite', t => { const s = t.objectStore(name); keys.forEach(k => s.delete(k)); }),
    delFood: id => run(['foods', 'favorites'], 'readwrite', t => { t.objectStore('foods').delete(id); t.objectStore('favorites').delete(id); }),
    saveProfile: p => run(['profile'], 'readwrite', t => { t.objectStore('profile').put(p, 'main'); }),
    saveWeight: (w, p) => run(['weights', 'profile'], 'readwrite', t => { t.objectStore('weights').put(w); t.objectStore('profile').put(p, 'main'); }),
    setMeta: (key, value) => run(['meta'], 'readwrite', t => { t.objectStore('meta').put({ key, value }); }),
    clearAll: () => run(STORES, 'readwrite', t => STORES.forEach(n => t.objectStore(n).clear())),
    /* One transaction: if anything fails, nothing is replaced. */
    replaceAll: s => run(STORES, 'readwrite', t => {
      DATA_STORES.forEach(n => t.objectStore(n).clear());
      t.objectStore('profile').put(s.profile, 'main');
      putAll(t, 'entries', s.entries);
      putAll(t, 'water', waterToList(s.water));
      putAll(t, 'weights', s.weights);
      putAll(t, 'foods', s.foods || []);
      putAll(t, 'favorites', (s.favorites || []).map(id => ({ id, addedAt: Date.now() })));
    }),
  };
})();

function stateFromDB(o) {
  const water = {};
  (o.water || []).forEach(w => { water[w.date] = w.ml; });
  const meta = {};
  (o.meta || []).forEach(m => { meta[m.key] = m.value; });
  return {
    state: {
      profile: { ...DEFAULT_PROFILE, ...(o.profile || {}) },
      entries: (o.entries || []).sort((a, b) => a.createdAt - b.createdAt),
      water,
      weights: (o.weights || []).sort((a, b) => a.date < b.date ? -1 : 1),
      foods: o.foods || [],
      favorites: (o.favorites || []).sort((a, b) => a.addedAt - b.addedAt).map(f => f.id),
    },
    meta,
  };
}

function persistAction(a, next) {
  switch (a.type) {
    case 'addEntries': return DB.put('entries', a.entries);
    case 'updateEntry': return DB.put('entries', [a.entry]);
    case 'deleteEntry': return DB.del('entries', [a.id]);
    case 'addWater': return DB.put('water', [{ date: a.date, ml: next.water[a.date] || 0 }]);
    case 'setProfile': return DB.saveProfile(next.profile);
    case 'logWeight': return DB.saveWeight({ date: a.date, kg: a.kg }, next.profile);
    case 'deleteWeight': return DB.del('weights', [a.date]);
    case 'saveFood': return DB.put('foods', [a.food]);
    case 'deleteFood': return DB.delFood(a.id);
    case 'toggleFav': return next.favorites.includes(a.id) ? DB.put('favorites', [{ id: a.id, addedAt: Date.now() }]) : DB.del('favorites', [a.id]);
    case 'deleteFoods': return DB.del('foods', a.ids);
    case 'reset': return DB.clearAll();
    default: return Promise.resolve();
  }
}

async function requestPersist() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch (_) { return null; }
}

const BACKUP_VERSION = 2;
const isDateKey = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const okNum = (v, lo, hi) => typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi;

function makeBackup(s) {
  return JSON.stringify({
    app: 'FitFuel AI', version: BACKUP_VERSION, exportedAt: new Date().toISOString(),
    profile: s.profile, entries: s.entries, water: waterToList(s.water), weights: s.weights, foods: s.foods, favorites: s.favorites,
  });
}
function cleanProfile(p) {
  const o = { ...DEFAULT_PROFILE };
  if (!p || typeof p !== 'object') return o;
  if (typeof p.name === 'string') o.name = p.name.slice(0, 30);
  if (p.gender === 'Male' || p.gender === 'Female') o.gender = p.gender;
  const ranges = { age: [12, 100], height: [100, 250], weight: [30, 300], kcal: [800, 6000], protein: [1, 500], carbs: [0, 1000], fat: [1, 400], water: [500, 8000] };
  for (const [k, [lo, hi]] of Object.entries(ranges)) if (okNum(p[k], lo, hi)) o[k] = p[k];
  if (p.targetWeight === '' || okNum(p.targetWeight, 30, 300)) o.targetWeight = p.targetWeight;
  return o;
}
function cleanEntry(e) {
  if (!e || typeof e !== 'object' || !isDateKey(e.date) || !MEALS.some(m => m.id === e.meal)) return null;
  if (typeof e.name !== 'string' || !e.name.trim()) return null;
  if (!['grams', 'kcal', 'protein', 'carbs', 'fat'].every(k => okNum(e[k], 0, 100000))) return null;
  const per100 = e.per100 && NUTS.every(k => okNum(e.per100[k], 0, 10000)) ? Object.fromEntries(NUTS.map(k => [k, e.per100[k]])) : null;
  return {
    id: typeof e.id === 'string' && e.id ? e.id.slice(0, 64) : uid(), date: e.date, meal: e.meal, name: e.name.trim().slice(0, 120),
    grams: e.grams, kcal: e.kcal, protein: e.protein, carbs: e.carbs, fat: e.fat, per100,
    source: typeof e.source === 'string' ? e.source.slice(0, 20) : 'manual', estimate: !!e.estimate,
    foodId: typeof e.foodId === 'string' ? e.foodId.slice(0, 64) : undefined,
    createdAt: okNum(e.createdAt, 0, 1e14) ? e.createdAt : Date.now(),
  };
}
function cleanFood(f) {
  if (!f || typeof f !== 'object' || typeof f.id !== 'string' || !/^(my|usda):/.test(f.id) || !['custom', 'usda'].includes(f.db)) return null;
  if (typeof f.name !== 'string' || !f.name.trim() || !f.per100 || !NUTS.every(k => okNum(f.per100[k], 0, 10000))) return null;
  const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
  return {
    id: f.id.slice(0, 64), db: f.db, name: f.name.trim().slice(0, 120), aliases: [], category: str(f.category, 60), source: str(f.source, 120), note: str(f.note, 200),
    dataType: str(f.dataType, 40), fdcId: okNum(f.fdcId, 0, 1e12) ? f.fdcId : undefined,
    per100: Object.fromEntries(NUTS.map(k => [k, f.per100[k]])), energyCalc: !!f.energyCalc, serving: null, verified: f.db === 'usda',
    usedAt: okNum(f.usedAt, 0, 1e14) ? f.usedAt : 0, uses: okNum(f.uses, 0, 1e7) ? f.uses : 0, createdAt: okNum(f.createdAt, 0, 1e14) ? f.createdAt : Date.now(),
  };
}

function parseBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (_) { throw new Error('This file can’t be read as a backup. Choose a .json file made by FitFuel AI.'); }
  if (!d || d.app !== 'FitFuel AI' || typeof d.version !== 'number') throw new Error('This file isn’t a FitFuel AI backup.');
  if (d.version > BACKUP_VERSION) throw new Error('This backup comes from a newer version of FitFuel AI. Update the app first.');
  const rawE = Array.isArray(d.entries) ? d.entries : [];
  const byId = new Map();
  rawE.map(cleanEntry).filter(Boolean).forEach(e => byId.set(e.id, e));
  const entries = [...byId.values()].sort((a, b) => a.createdAt - b.createdAt);
  const water = {};
  (Array.isArray(d.water) ? d.water : []).forEach(w => { if (w && isDateKey(w.date) && okNum(w.ml, 0, 20000)) water[w.date] = w.ml; });
  const wmap = new Map();
  (Array.isArray(d.weights) ? d.weights : []).forEach(w => { if (w && isDateKey(w.date) && okNum(w.kg, 20, 400)) wmap.set(w.date, { date: w.date, kg: w.kg }); });
  const weights = [...wmap.values()].sort((a, b) => a.date < b.date ? -1 : 1);
  const fmap = new Map();
  (Array.isArray(d.foods) ? d.foods : []).map(cleanFood).filter(Boolean).forEach(f => fmap.set(f.id, f));
  const foods = [...fmap.values()];
  const knownIds = new Set([...foods.map(f => f.id), ...MAL_FOODS.map(f => f.id)]);
  const favorites = [...new Set((Array.isArray(d.favorites) ? d.favorites : []).filter(id => typeof id === 'string' && knownIds.has(id)))];
  return {
    state: { profile: cleanProfile(d.profile), entries, water, weights, foods, favorites },
    skipped: rawE.length - entries.length,
    exportedAt: typeof d.exportedAt === 'string' ? d.exportedAt : null,
  };
}

const csvCell = v => {
  if (v == null) return '';
  if (typeof v === 'number') return String(v);
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; /* stop spreadsheets treating text as a formula */
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
const toCSV = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const mealOrder = id => MEALS.findIndex(m => m.id === id);
function csvFoodLog(s) {
  const list = [...s.entries].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : mealOrder(a.meal) - mealOrder(b.meal) || a.createdAt - b.createdAt);
  return toCSV([['Date', 'Meal', 'Food', 'Grams', 'Calories (kcal)', 'Protein (g)', 'Carbs (g)', 'Fat (g)', 'Source', 'Estimate'],
    ...list.map(e => [e.date, mealLabel(e.meal), e.name, e.grams, e.kcal, e.protein, e.carbs, e.fat, sourceLabel(e.source), e.estimate ? 'Yes' : 'No'])]);
}
function csvDaily(s) {
  const dates = [...new Set([...s.entries.map(e => e.date), ...Object.keys(s.water).filter(k => s.water[k] > 0), ...s.weights.map(w => w.date)])].sort();
  const wByDate = Object.fromEntries(s.weights.map(w => [w.date, w.kg]));
  return toCSV([['Date', 'Calories (kcal)', 'Protein (g)', 'Carbs (g)', 'Fat (g)', 'Foods logged', 'Water (ml)', 'Weight (kg)'],
    ...dates.map(k => { const list = s.entries.filter(e => e.date === k); const t = sumNut(list); return [k, Math.round(t.kcal), r1(t.protein), r1(t.carbs), r1(t.fat), list.length, s.water[k] || 0, wByDate[k] != null ? wByDate[k] : '']; })]);
}
function csvWeights(s) { return toCSV([['Date', 'Weight (kg)'], ...s.weights.map(w => [w.date, w.kg])]); }

/* Share sheet first (lets iPhone "Save to Files"); download link as a fallback. */
async function saveFile(name, type, text) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.share) {
    let can = false;
    try { can = navigator.canShare({ files: [file] }); } catch (_) {}
    if (can) {
      try { await navigator.share({ files: [file], title: name }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return 'downloaded';
}

const polar = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const arcPath = (cx, cy, r, a0, a1) => {
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};

/* The fuel dial: 61 ticks for calories, inner arc for protein. */
function FuelDial({ kcal, target, protein, proteinTarget }) {
  const [shown, setShown] = useState(false);
  useEffect(() => { const id = requestAnimationFrame(() => setTimeout(() => setShown(true), 60)); return () => cancelAnimationFrame(id); }, []);
  const N = 61, A0 = 125, SWEEP = 290;
  const frac = target > 0 ? kcal / target : 0;
  const over = kcal > target;
  const lit = shown ? Math.round(clamp(frac, 0, 1) * (N - 1)) : -1;
  const pFrac = shown && proteinTarget > 0 ? clamp(protein / proteinTarget, 0, 1) : 0;
  const remaining = target - kcal;
  const ticks = [];
  for (let i = 0; i < N; i++) {
    const a = A0 + SWEEP * i / (N - 1);
    const major = i % 10 === 0;
    const [x0, y0] = polar(150, 150, major ? 120 : 125, a);
    const [x1, y1] = polar(150, 150, 140, a);
    const on = kcal > 0 && i <= lit;
    ticks.push(html`<line key=${i} x1=${x0} y1=${y0} x2=${x1} y2=${y1}
      className=${'tick' + (major ? ' major' : '') + (on ? ' on' : '') + (on && over ? ' over' : '') + (on && i === lit && !over ? ' tip' : '')}
      style=${{ transitionDelay: `${i * 12}ms` }} />`);
  }
  const pPath = arcPath(150, 150, 104, A0, A0 + SWEEP);
  return html`<div className="dial" role="img" aria-label=${`${fmt(kcal)} of ${fmt(target)} kcal eaten, ${fmt(protein)} of ${fmt(proteinTarget)} g protein`}>
    <svg viewBox="0 0 300 300">
      ${ticks}
      <path d=${pPath} className="p-track" />
      <path d=${pPath} className="p-arc" pathLength="1" style=${{ strokeDasharray: `${pFrac} 1`, opacity: pFrac > 0 ? 1 : 0 }} />
    </svg>
    <div className="dial-center">
      <div className=${'dial-big num' + (over ? ' over' : '')}>${fmt(Math.abs(remaining))}</div>
      <div className="dial-unit">${over ? 'kcal over target' : 'kcal left'}</div>
      <div className="dial-pro"><i></i>${fmt(protein)} / ${fmt(proteinTarget)} g protein</div>
    </div>
  </div>`;
}

function CalorieChart({ days, target, selected }) {
  const W = 340, H = 170, pl = 4, pr = 4, pt = 10, pb = 22;
  const max = Math.max(target * 1.2, ...days.map(d => d.kcal), 1);
  const bw = (W - pl - pr) / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const every = days.length > 10 ? 5 : 1;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} className="chart" role="img" aria-label="Daily calories compared with target">
    ${days.map((d, i) => {
      const x = pl + i * bw + bw * 0.18, w = bw * 0.64;
      const h = d.kcal > 0 ? Math.max(3, H - pb - y(d.kcal)) : 3;
      const cls = 'bar-r' + (d.kcal === 0 ? ' zero' : d.kcal > target ? ' over' : '');
      const label = days.length > 10 ? String(fromKey(d.key).getDate()) : fromKey(d.key).toLocaleDateString('en-GB', { weekday: 'narrow' });
      return html`<g key=${d.key}>
        <rect className=${cls} x=${x} y=${H - pb - h} width=${w} height=${h} rx=${Math.min(5, w / 2)} />
        ${(i % every === 0 || i === days.length - 1) && html`<text className=${'lbl' + (d.key === selected ? ' sel' : '')} x=${x + w / 2} y=${H - 6} textAnchor="middle">${label}</text>`}
      </g>`;
    })}
    <line className="tline" x1=${pl} x2=${W - pr} y1=${y(target)} y2=${y(target)} />
  </svg>`;
}

function WeightChart({ points }) {
  const W = 340, H = 150, pl = 4, pr = 4, pt = 12, pb = 12;
  if (points.length < 2) return null;
  const vals = points.flatMap(p => [p.kg, p.avg]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
  const t0 = fromKey(points[0].date).getTime(), t1 = fromKey(points[points.length - 1].date).getTime();
  const x = d => pl + (W - pl - pr) * ((fromKey(d).getTime() - t0) / Math.max(1, t1 - t0));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)} ${y(p.avg).toFixed(1)}`).join(' ');
  return html`<svg viewBox=${`0 0 ${W} ${H}`} className="chart" role="img" aria-label="Weight with 7-day average">
    ${[0.25, 0.5, 0.75].map(f => html`<line key=${f} className="grid" x1=${pl} x2=${W - pr} y1=${pt + (H - pt - pb) * f} y2=${pt + (H - pt - pb) * f} />`)}
    ${points.map(p => html`<circle key=${p.date} className="wdot" cx=${x(p.date)} cy=${y(p.kg)} r="3" />`)}
    <path className="wline" d=${line} />
  </svg>`;
}

function Progress() {
  const { state, openSheet, dispatch, notify } = useApp();
  const [range, setRange] = useState(7);
  const p = state.profile;
  const t = todayKey();
  const days = Array.from({ length: range }, (_, i) => addDays(t, i - range + 1)).map(key => {
    const tot = sumNut(state.entries.filter(e => e.date === key));
    return { key, ...tot };
  });
  const logged = days.filter(d => d.kcal > 0);
  const avgK = logged.length ? logged.reduce((a, d) => a + d.kcal, 0) / logged.length : 0;
  const avgP = logged.length ? logged.reduce((a, d) => a + d.protein, 0) / logged.length : 0;
  const calHits = logged.filter(d => d.kcal <= p.kcal).length;
  const proHits = logged.filter(d => d.protein >= p.protein).length;

  const ws = state.weights;
  const avgOf = (endKey) => {
    const startKey = addDays(endKey, -6);
    const win = ws.filter(w => w.date >= startKey && w.date <= endKey);
    return win.reduce((a, w) => a + w.kg, 0) / win.length;
  };
  const inRange = ws.filter(w => w.date >= addDays(t, -range + 1)).map(w => ({ ...w, avg: avgOf(w.date) }));
  const latest = ws[ws.length - 1];
  const avg7 = latest ? avgOf(latest.date) : 0;
  const change = inRange.length > 1 ? inRange[inRange.length - 1].kg - inRange[0].kg : null;

  const Meter = ({ hits, total, cls }) => html`<div className="meter">${Array.from({ length: Math.min(total, 10) }, (_, i) => html`<i key=${i} className=${i < Math.round(hits / Math.max(total, 1) * Math.min(total, 10)) ? 'on ' + (cls || '') : ''}></i>`)}</div>`;

  return html`<div>
    <header className="top"><h1 className="title">Progress</h1></header>
    <div className="seg" style=${{ margin: '14px 0 14px' }}>
      ${[7, 30].map(r => html`<button key=${r} className=${range === r ? 'on' : ''} onClick=${() => setRange(r)}>${r} days</button>`)}

/* ---------------- Settings ---------------- */

  const { state, openSheet, openScan, meta, storage, backup, notify } = useApp();
  const p = state.profile;
  const fileRef = useRef(null);
  const onRestoreFile = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) return notify('That file is too large to be a FitFuel backup.', 'err');
    try { openSheet('restore', { parsed: parseBackup(await file.text()) }); }
    catch (err) { notify(err && err.message ? err.message : 'That file couldn’t be read.', 'err'); }
  };
  const storeSub = !storage.ok ? 'Saving isn’t available here. Turn off Private Browsing, or open FitFuel from your Home Screen.'
    : storage.persisted ? 'Protected from automatic clean-up'
    : 'iPhone may clear website data if storage runs very low. Keep regular backups.';
  const Row = ({ icon, tone, label, sub, value, badge, onClick, disabled }) => html`<button className="row press" onClick=${onClick} disabled=${disabled}>
    <span className=${'ri ' + (tone || '')}><${Icon} name=${icon} size=${17} /></span>
    <span className="rl">${label}${sub && html`<small>${sub}</small>`}</span>
    ${value != null && html`<span className="rv">${value}</span>`}
    ${badge && html`<span className=${'badge ' + (badge.tone || '')}>${badge.text}</span>`}

          <p>${p.age} years, ${p.gender.toLowerCase()}, ${fmt(p.height)} cm, ${fmt1(p.weight)} kg</p>
          ${p.targetWeight !== '' && html`<p>Target weight ${fmt1(p.targetWeight)} kg</p>`}

      <${Row} icon="zap" tone="lime" label="Calories" value=${`${fmt(p.kcal)} kcal`} onClick=${() => openSheet('targets')} />
      <${Row} icon="target" label="Macros" value=${`${fmt(p.protein)} / ${fmt(p.carbs)} / ${fmt(p.fat)} g`} onClick=${() => openSheet('targets')} />
      <${Row} icon="drop" label="Water" value=${`${fmt(p.water)} ml`} onClick=${() => openSheet('targets')} />
    </div>

    <p className="group-title">Food scanner</p>
    <div className="group">
      <${Row} icon="sparkles" label="AI provider" sub="Sample results only until an AI service is connected" badge=${{ text: 'Demo mode', tone: 'coral' }} onClick=${openScan} />
      <${Row} icon="database" label="Food database" sub=${`${MAL_FOODS.length} Malaysian dishes, USDA search, ${state.foods.filter(f => f.db === 'custom').length} of your own`} onClick=${() => openSheet('foodDb')} />
    </div>

    <p className="group-title">Your data</p>
    <div className="group">
      <div className="row">
        <span className=${'ri ' + (storage.ok ? 'lime' : 'red')}><${Icon} name="database" size=${17} /></span>
        <span className="rl">${storage.ok ? 'Saved on this iPhone' : 'Not saving'}<small>${storeSub}</small></span>
      </div>
      <${Row} icon="download" label="Back up now" sub=${`Last backup ${relDays(meta.lastBackup)}`} onClick=${backup} />
      <${Row} icon="upload" label="Restore from backup" sub="Replaces the data on this iPhone" onClick=${() => fileRef.current && fileRef.current.click()} />
      <${Row} icon="file" label="Export to CSV" sub="For Excel or Google Sheets" onClick=${() => openSheet('export')} />

/* ---------------- Sheets ---------------- */
function Sheet({ title, onClose, children, lead, tall }) {
  const [closing, setClosing] = useState(false);
  const close = useCallback(() => { setClosing(true); setTimeout(onClose, 200); }, [onClose]);
  useEffect(() => { document.body.classList.add('lock'); return () => document.body.classList.remove('lock'); }, []);
  return html`<div className=${closing ? 'closing' : ''}>
    <div className="backdrop" onClick=${close}></div>
    <div className=${'sheet' + (tall ? ' tall' : '')} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="grab"></div>
      <div className="sheet-head"><h2>${title}</h2><button className="round-btn press" aria-label="Close" onClick=${close}><${Icon} name="x" size=${17} /></button></div>
      ${lead && html`<p className="lead">${lead}</p>`}
      ${typeof children === 'function' ? children(close) : children}
    </div>
  </div>`;
}

function NumField({ label, value, onChange, unit, placeholder }) {
  return html`<div className="field"><label>${label}</label>
    <div className="inp-unit"><input className="inp num" inputMode="decimal" value=${value} placeholder=${placeholder || ''} onChange=${e => onChange(e.target.value)} />${unit && html`<span>${unit}</span>`}</div>

}

function MealSeg({ value, onChange }) {

function EnergyHint({ kcal, p, c, f }) {

function FoodSearchSheet({ meal, onClose }) {
  const { state, meta } = useApp();
  const [q, setQ] = useState('');
  const [view, setView] = useState({ name: 'search' });
  const [usda, setUsda] = useState({ status: 'idle', q: '', results: [], error: '' });
  const abortRef = useRef(null);
  useEffect(() => () => { if (abortRef.current) abortRef.current.abort(); }, []);
  const all = useMemo(() => [...MAL_FOODS, ...state.foods], [state.foods]);
  const byId = useMemo(() => new Map(all.map(f => [f.id, f])), [all]);
  const local = useMemo(() => searchFoods(q, all), [q, all]);
  const favs = state.favorites.map(id => byId.get(id)).filter(Boolean);
  const recents = useMemo(() => {
    const out = [], seen = new Set();
    for (const e of [...state.entries].sort((a, b) => b.createdAt - a.createdAt)) {
      const f = e.foodId && byId.get(e.foodId);
      if (f && !seen.has(f.id) && !state.favorites.includes(f.id)) { seen.add(f.id); out.push(f); }
      if (out.length >= 6) break;
    }
    return out;
  }, [state.entries, state.favorites, byId]);
  const term = q.trim();
  const runUsda = async () => {
    if (term.length < 2) return;
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    setUsda({ status: 'loading', q: term, results: [], error: '' });
    try { setUsda({ status: 'done', q: term, results: await usdaSearch(term, meta.usdaKey, ctrl.signal), error: '' }); }
    catch (e) { const msg = usdaErrorText(e); if (msg) setUsda({ status: 'error', q: term, results: [], error: msg }); }
  };
  const fresh = usda.q === term;
  const open = food => setView({ name: 'detail', food });
  const rows = (list, fav) => list.map(f => html`<${FoodRow} key=${f.id} food=${f} fav=${fav || state.favorites.includes(f.id)} onClick=${() => open(f)} />`);
  return html`<${Sheet} tall title=${view.name === 'custom' ? 'Enter a food' : 'Add food'} onClose=${onClose}>
    ${close => view.name === 'detail' ? html`<${FoodDetail} food=${view.food} meal0=${meal} onBack=${() => setView({ name: 'search' })} onDone=${close} />`
      : view.name === 'custom' ? html`<${CustomFood} meal0=${meal} name0=${term} onBack=${() => setView({ name: 'search' })} onDone=${close} />`
      : html`<div>
        <form className="search" onSubmit=${e => { e.preventDefault(); runUsda(); }}>
          <span className="search-ic"><${Icon} name="search" size=${18} /></span>
          <input className="inp" type="search" enterKeyHint="search" autoComplete="off" placeholder="Search nasi lemak, egg, oats…" value=${q} onChange=${e => setQ(e.target.value)} aria-label="Search foods" />
        </form>
        ${!term ? html`<div>
          ${favs.length > 0 && html`<${Section} title="Favourites">${rows(favs, true)}<//>`}
          ${recents.length > 0 && html`<${Section} title="Recently used">${rows(recents)}<//>`}
          <${Section} title="Malaysian dishes" sub="Lab-analysed">${rows(MAL_FOODS)}<//>
        </div>` : html`<div>
          ${local.length > 0 ? html`<${Section} title="Matches" sub="Malaysian and saved">${rows(local.slice(0, 30))}<//>`
            : html`<p className="hint" style=${{ margin: '4px 2px 12px' }}>No Malaysian or saved food matches “${term}”.</p>`}
          <div className="fsec">
            <div className="fsec-head"><h4>USDA FoodData Central</h4><span>Generic foods, in English</span></div>
            ${fresh && usda.status === 'loading' ? html`<div className="group">${[0, 1, 2].map(i => html`<div key=${i} className="skel-row"><div className="skel"></div></div>`)}</div>`
              : fresh && usda.status === 'error' ? html`<div><div className="banner info"><${Icon} name="info" size=${16} /><span>${usda.error}</span></div><button className="btn ghost block press" onClick=${runUsda}>Try again</button></div>`
              : fresh && usda.status === 'done' ? (usda.results.length ? html`<div className="group">${rows(usda.results)}</div>`
                : html`<p className="hint" style=${{ margin: '4px 2px 0' }}>USDA has nothing for “${usda.q}”. Try a simple English word, like “egg” or “chicken breast”.</p>`)
              : html`<button className="add-big press" disabled=${term.length < 2} onClick=${runUsda}><${Icon} name="globe" size=${18} />Search USDA for “${term}”</button>`}
          </div>
        </div>`}
        <button className="link press" style=${{ margin: '16px 0 2px' }} onClick=${() => setView({ name: 'custom' })}><${Icon} name="plus" size=${15} />Enter a food manually</button>
      </div>`}
  <//>`;
}

function FoodDetail({ food, meal0, onBack, onDone }) {
  const { state, date, dispatch, notify } = useApp();
  const last = useMemo(() => {
    const e = state.entries.filter(x => x.foodId === food.id).sort((a, b) => b.createdAt - a.createdAt)[0];
    return e ? e.grams : null;
  }, [state.entries, food.id]);
  const [grams, setGrams] = useState(String(last || (food.serving ? food.serving.g : 100)));
  const [meal, setMeal] = useState(meal0 || mealForNow());
  const [err, setErr] = useState('');
  const g = num(grams);
  const n = Object.fromEntries(NUTS.map(k => [k, food.per100[k] * g / 100]));
  const fav = state.favorites.includes(food.id);
  const toggleFav = () => {
    if (food.db === 'usda' && !state.foods.some(f => f.id === food.id)) dispatch({ type: 'saveFood', food: { ...food, usedAt: 0, uses: 0 } });
    dispatch({ type: 'toggleFav', id: food.id });
    notify(fav ? 'Removed from favourites' : 'Added to favourites');
  };
  const add = () => {
    if (!(g > 0)) return setErr('Enter the portion size in grams.');
    if (g > 3000) return setErr('Portion looks too large. Check the grams.');
    const f = { name: food.name, meal, grams: String(g), kcal: String(n.kcal), protein: String(n.protein), carbs: String(n.carbs), fat: String(n.fat), per100: { ...food.per100 } };
    dispatch({ type: 'addEntries', entries: [{ ...toEntry(f, date, food.db, false), foodId: food.id }] });
    if (food.db !== 'mal') {
      const prev = state.foods.find(x => x.id === food.id);
      dispatch({ type: 'saveFood', food: { ...(prev || food), usedAt: Date.now(), uses: ((prev && prev.uses) || 0) + 1 } });
    }
    notify(`Added to ${mealLabel(meal)}`);
    onDone();
  };
  const chips = [{ label: '100 g', g: 100 }];
  if (food.serving) chips.push({ label: `Serving, ${fmt(food.serving.g)} g`, g: food.serving.g });
  if (last && last !== 100 && (!food.serving || last !== food.serving.g)) chips.push({ label: `Last time, ${fmt(last)} g`, g: last });
  return html`<div>
    <button className="link mute press back" onClick=${onBack}><${Icon} name="left" size=${16} />Search</button>
    <div className="detail-head">
      <h3>${food.name}</h3>
      <button className=${'round-btn press fav-btn' + (fav ? ' on' : '')} aria-label=${fav ? 'Remove from favourites' : 'Add to favourites'} aria-pressed=${fav} onClick=${toggleFav}><${Icon} name="star" size=${18} /></button>
    </div>
    <div className="src-box">
      <div><span className=${'src src-' + food.db}>${DB_LABEL[food.db]}</span>${food.verified && html`<span className="ver"><${Icon} name="check" size=${12} stroke=${3} />Published value</span>`}</div>
      <p>${food.source}. ${food.note || ''}${food.energyCalc ? ' Calories were worked out from the macros because USDA lists none for this food.' : ''}</p>
    </div>
    <div className="chips-row">${chips.map(c => html`<button key=${c.label} className=${'chip2 press' + (g === c.g ? ' on' : '')} onClick=${() => { setGrams(String(c.g)); setErr(''); }}>${c.label}</button>`)}</div>
    <div className="portion">
      <label>Portion</label>
      <button className="round-btn press" aria-label="Less" onClick=${() => setGrams(String(Math.max(0, Math.round(g - 10))))}><${Icon} name="minus" size=${16} /></button>
      <div className="inp-unit"><input className="inp num" inputMode="decimal" aria-label="Portion in grams" value=${grams} onChange=${e => { setGrams(e.target.value); setErr(''); }} /><span>g</span></div>
      <button className="round-btn press" aria-label="More" onClick=${() => setGrams(String(Math.round(g + 10)))}><${Icon} name="plus" size=${16} /></button>
    </div>
    <div className="nut-card">
      <div className="nut-big"><b className="num">${fmt(n.kcal)}</b><span>kcal</span></div>
      <div className="nut-macros">
        <div><b className="num" style=${{ color: 'var(--mint)' }}>${fmt1(n.protein)} g</b><span>Protein</span></div>
        <div><b className="num" style=${{ color: 'var(--gold)' }}>${fmt1(n.carbs)} g</b><span>Carbs</span></div>
        <div><b className="num" style=${{ color: 'var(--coral)' }}>${fmt1(n.fat)} g</b><span>Fat</span></div>
      </div>
    </div>
    <div className="field"><label>Meal</label><${MealSeg} value=${meal} onChange=${setMeal} /></div>
    ${err && html`<p className="err"><${Icon} name="alert" size=${15} />${err}</p>`}
    <div className="actions"><button className="btn primary press" onClick=${add}>Add to ${mealLabel(meal)}</button></div>
  </div>`;
}

function CustomFood({ meal0, name0, onBack, onDone }) {
  const { date, dispatch, notify } = useApp();
  const [save, setSave] = useState(true);
  return html`<div>
    <button className="link mute press back" onClick=${onBack}><${Icon} name="left" size=${16} />Search</button>
    <${FoodForm} initial=${{ meal: meal0 || mealForNow(), name: name0 || '' }} submitLabel="Add to log"
      before=${html`<label className="check"><input type="checkbox" checked=${save} onChange=${e => setSave(e.target.checked)} /><span>Save to My foods so I can find it next time</span></label>`}
      onSubmit=${f => {
        const g = num(f.grams);
        let foodId;
        if (save && g > 0) {
          const food = {
            id: 'my:' + uid(), db: 'custom', name: f.name.trim().slice(0, 120), aliases: [], category: 'My foods', source: 'Entered by you', note: 'Values you typed in yourself.',
            per100: Object.fromEntries(NUTS.map(k => [k, r1(num(f[k]) / g * 100)])), serving: null, verified: false, usedAt: Date.now(), uses: 1, createdAt: Date.now(),
          };

      }} />

function FoodDbSheet({ onClose }) {
  const { state, meta, setMeta, dispatch, notify } = useApp();
  const [key, setKey] = useState(meta.usdaKey || '');
  const [test, setTest] = useState({ status: 'idle', msg: '' });
  const mine = state.foods.filter(f => f.db === 'custom').sort((a, b) => a.name.localeCompare(b.name));
  const cached = state.foods.filter(f => f.db === 'usda');
  const unused = cached.filter(f => !state.favorites.includes(f.id));
  const validKey = k => !k || /^[A-Za-z0-9]{20,64}$/.test(k);
  const saveKey = () => {
    const k = key.trim();
    if (!validKey(k)) return setTest({ status: 'err', msg: 'That doesn’t look like a USDA key. It should be one long string of letters and numbers.' });
    setMeta('usdaKey', k); setTest({ status: 'idle', msg: '' });
    notify(k ? 'USDA key saved' : 'Using the shared demo key');
  };
  const runTest = async () => {
    const k = key.trim();

function downscale(file, max) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    im.src = u;
  });
}
